spring.application.name=user-service
server.port=8080
logging.level.org.springframework.cloud.gateway=DEBUG



## Database
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=neo_pass
logging.level.org.springframework.data.neo4j=DEBUG

# JPA and Hibernate Properties
# Display SQL statements in the console
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# DataSource Properties
spring.datasource.url=jdbc:postgresql://localhost:5432/social_graph
spring.datasource.username=postgres
spring.datasource.password=postgress

# Eureka client configs
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
